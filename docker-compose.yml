services:
  nginx:
    image: nginx:alpine
    container_name: php_login_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-app
    networks:
      - login_network

  php-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: php_login_app
    expose:
      - "80"
    volumes:
      - ./app:/var/www/html
      - /var/www/html/vendor
    env_file:
      - .env
    depends_on:
      - mysql
    networks:
      - login_network

  mysql:
    image: mysql:8.0
    container_name: php_login_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - login_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: php_login_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - login_network

volumes:
  mysql_data:

networks:
  login_network:
    driver: bridge
